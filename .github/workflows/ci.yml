name: CI

# Test what's settled, and don't make a pull request wait for what it can't break (the
# owner, Nov 9). A pull request runs the whole suite on Linux, in thirds side by side, and
# on macOS and Windows the self-test and a recorded bot run, whose final hashes must match
# Linux's: a recording made anywhere has to replay identically everywhere. A push to main
# and the weekly run add the whole suite on macOS and Windows. Once a week, and on demand,
# bots also play fresh valleys for hours, checking the motor's promises every tick, and the
# synctest saves, restores and re-steps for hours more. (engines.yml runs the browsers'
# and Bun's engines on every push.) The repository is public, so these minutes are free.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.shard }} of 3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: matrix.shard == 1
        run: npm run typecheck
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  build:
    name: Build, and a recorded bot run (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 20-minute bot run, recorded and re-simulated
        shell: bash
        run: npm run sim -- --minutes 20 | tee sim.log && grep '^hash' sim.log | awk '{print $2}' > hash-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hash-linux
          path: hash-linux.txt

  # Pull requests land only from branches up to date with main (docs/phase-1-plan.md,
  # Landing on main): two that are each green alone can leave main's goldens wrong
  # together. The repository's plan has no merge queue or branch rule, so this check and
  # `npm run land` are the rule.
  up-to-date:
    name: Up to date with main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - shell: bash
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          if git merge-base --is-ancestor "origin/${{ github.base_ref }}" HEAD; then
            echo "Up to date with ${{ github.base_ref }} ($(git rev-parse --short origin/${{ github.base_ref }}))."
          else
            echo "This branch is behind ${{ github.base_ref }}: merge origin/${{ github.base_ref }} into it (or use Update branch), regenerate its goldens (npm run golden, npm run bench -- --write and golden.ts), and push." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # Goldens explain themselves: for every pinned run that moved since the base, the first
  # divergent tick, the state paths that differ there, and each lane's work and metrics.
  explain:
    name: Goldens, explained
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # With no pin changed there's nothing to explain: a pinned run that had moved anyway would fail the tests.
      - id: pins
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if git diff --quiet "$BASE" HEAD -- src/sim/game/golden.ts src/sim/game/benchGolden.ts; then
            echo "No pin changed, so nothing to explain."
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pins.outputs.changed == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.pins.outputs.changed == 'yes'
        run: npm ci
      - if: steps.pins.outputs.changed == 'yes'
        shell: bash
        run: npm run explain -- --base "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}" --summary "$GITHUB_STEP_SUMMARY"

  platforms:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The whole suite, on main and in the weekly run
        if: github.event_name != 'pull_request'
        run: npm run check
      - name: Self-test, in this platform's engine
        run: npm run selftest
      - name: 20-minute bot run, recorded and re-simulated
        shell: bash
        run: npm run sim -- --minutes 20 | tee sim.log && grep '^hash' sim.log | awk '{print $2}' > hash-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.os }}
          path: hash-${{ matrix.os }}.txt

  fuzz:
    name: Long invariant run (fresh valleys)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 20 fresh valleys × two bots × an hour each: 40 hours of play, every body checked every tick.
      - run: npm run fuzz -- --seeds 20 --minutes 60 --out fuzz-failures
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: fuzz-failures/

  synctest:
    name: Long synctest run (save, restore, re-step)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 5 fresh valleys × two bots × an hour each, every 30 ticks saved through the
      # on-disk codec and by rollback, put back, re-stepped and compared (kernel/synctest.ts).
      - run: npm run fuzz -- --seeds 5 --minutes 60 --synctest --out synctest-failures
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synctest-failures
          path: synctest-failures/

  # The plans against the camp (src/lab/experiments/ladder.ts): who wins, on fresh dice,
  # with the numbers in the run's summary. A pull request only plays its canary (the
  # ladder scene), because a full ladder takes twenty minutes on a CI machine.
  ladder:
    name: The bot ladder
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - shell: bash
        run: |
          npm run experiment -- ladder --dice 3 | tee ladder.log
          { echo '```'; cat ladder.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  same-everywhere:
    name: Same hash on every platform
    needs: [build, platforms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          merge-multiple: true
      - shell: bash
        run: |
          cat hash-*.txt
          test "$(cat hash-*.txt | sort -u | wc -l)" -eq 1

  # One name for a branch rule to require, whichever jobs ran.
  all:
    name: All checks
    if: always()
    needs: [tests, build, up-to-date, explain, platforms, same-everywhere]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
