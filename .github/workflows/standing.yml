name: Standing benches

# Every change to how a camp behaves has to show the camp's other benches still read as
# they did (src/lab/standing.ts). This runs the standing set on the pull request's base
# and head, on clean machines, and compares them run by run in the job summary. It
# informs and never fails because a bench differs: whether a difference is intended is
# the author's call. Results are cached by what a bench depends on (the source, the
# packages and how it's compiled), so a base already run is not run again, and a pull
# request that touches only docs or tests runs nothing.
#
# The head's tool runs both sides (`--root`), so a base that predates the tool is run the
# same way.
#
# A push to main runs main alone and compares nothing. A cache made by a pull request's
# run is that pull request's alone to restore, and one made on main is every branch's:
# so this is what leaves main's results where the next pull requests find their base.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: The ref to compare this one with
        default: main

permissions:
  contents: read

concurrency:
  group: standing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: ${{ matrix.side }} (${{ matrix.shard }} of 4)
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(github.event_name == 'push' && '["head"]' || '["base", "head"]') }}
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - if: matrix.side == 'base'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base }}
          path: base
      # The same hash as src/headless/standing.ts, inputsOf: git's hashes of what a bench's results depend on, through SHA-256.
      - id: inputs
        shell: bash
        working-directory: ${{ matrix.side }}
        run: echo "hash=$(git rev-parse HEAD:src HEAD:package-lock.json HEAD:tsconfig.json HEAD:.nvmrc | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      # The key also carries the head's tool and its set: a side run by an older tool, or as an older set, is run again.
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: standing-results
          key: standing-${{ steps.inputs.outputs.hash }}-${{ hashFiles('head/src/lab/standing.ts', 'head/src/lab/results.ts', 'head/src/headless/labRunner.ts', 'head/src/headless/standing.ts') }}-${{ matrix.shard }}-of-4
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: head/.nvmrc
          cache: npm
          cache-dependency-path: head/package-lock.json
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: head
        run: npm ci
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.side == 'base'
        working-directory: base
        run: npm ci
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: head
        run: npm run standing -- --out ../standing-results --root '../${{ matrix.side }}' --shard ${{ matrix.shard }}/4 --jobs 4
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: standing-results
          key: standing-${{ steps.inputs.outputs.hash }}-${{ hashFiles('head/src/lab/standing.ts', 'head/src/lab/results.ts', 'head/src/headless/labRunner.ts', 'head/src/headless/standing.ts') }}-${{ matrix.shard }}-of-4
      - uses: actions/upload-artifact@v4
        with:
          name: standing-${{ matrix.side }}-${{ matrix.shard }}
          path: standing-results/

  compare:
    name: Standing benches, compared
    needs: run
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: actions/setup-node@v4
        with:
          node-version-file: head/.nvmrc
          cache: npm
          cache-dependency-path: head/package-lock.json
      - working-directory: head
        run: npm ci
      # Each shard's folder holds its benches and the same build.json, so the shards merge into one folder per side.
      - uses: actions/download-artifact@v4
        with:
          pattern: standing-base-*
          merge-multiple: true
          path: standing/base
      - uses: actions/download-artifact@v4
        with:
          pattern: standing-head-*
          merge-multiple: true
          path: standing/head
      - working-directory: head
        shell: bash
        run: npm run standing -- --diff ../standing/base ../standing/head --summary "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standing-results
          path: standing/
